<!doctype html>
<html lang="en">
  <head>
    <!-- ========================================================================
         Pulse Protocol - Official Brand Configuration
         ======================================================================== -->
    
    <!-- Character Encoding & Viewport -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    
    <!-- Official Title & Description -->
    <title>Pulse Protocol - Decentralized Prediction Markets</title>
    <meta
      name="description"
      content="A decentralized protocol for permissionless market creation and prediction. View, analyze, stake, and believe in any outcome."
    />
    <meta name="theme-color" content="#2563EB" />
    <meta name="background-color" content="#0F172A" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://pulse.protocol" />
    
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/x-icon" href="/brand/logo/favicon.ico" />
    <link rel="apple-touch-icon" href="/brand/logo/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/manifest/site.webmanifest" />
    
    <!-- Open Graph (Social Media) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pulse Protocol - Decentralized Prediction Markets" />
    <meta
      property="og:description"
      content="A decentralized protocol for permissionless market creation and prediction. View, analyze, stake, and believe in any outcome."
    />
    <meta property="og:url" content="https://pulse.protocol" />
    <meta property="og:image" content="https://pulse.protocol/brand/og/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Pulse Protocol" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pulse Protocol - Decentralized Prediction Markets" />
    <meta
      name="twitter:description"
      content="A decentralized protocol for permissionless market creation and prediction. View, analyze, stake, and believe in any outcome."
    />
    <meta name="twitter:image" content="https://pulse.protocol/brand/og/og-image.png" />
    <meta name="twitter:site" content="@pulse_protocol" />
    
    <!-- Additional Meta Tags -->
    <meta name="keywords" content="prediction market, decentralized, protocol, Web3, blockchain" />
    <meta name="author" content="Pulse Protocol" />
    <meta name="copyright" content="© 2026 Pulse Protocol. All rights reserved." />
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Analytics -->
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"
    ></script>
  </body>
</html>
